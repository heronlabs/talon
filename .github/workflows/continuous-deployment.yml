name: 'Continuous Deployment'

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      semantic:
        description: The SEMVER specification.
        required: true
        type: choice
        default: patch
        options:
          - 'major'
          - 'minor'
          - 'patch'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: release
        uses: heronlabs/action-tag-release-build@v7
        with:
          ghToken: ${{ github.token }}
          semantic: ${{ inputs.semantic }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build the Linux binary and its .deb
        env:
          GOARCH: amd64
          VERSION: ${{ steps.release.outputs.version }}
        run: make package

      - name: Attach the binary and the .deb to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$TAG" dist/talon-linux-amd64 dist/talon_*_amd64.deb

  # Adds the released .deb to the public apt repository. It takes the package
  # from the release, so "Re-run failed jobs" publishes without cutting another
  # release. Skipped until the repository variable APT_BUCKET_NAME is set.
  publish:
    name: 'Publish | apt'
    needs: release
    if: vars.APT_BUCKET_NAME != ''
    runs-on: ubuntu-24.04
    environment: 'main'
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    env:
      BUCKET: ${{ vars.APT_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the .deb from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release download "$TAG" --pattern 'talon_*_amd64.deb' --dir dist

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.APT_AWS_REGION }}
          role-to-assume: ${{ vars.APT_AWS_ROLE_TO_ASSUME }}
          role-session-name: talon-apt-publish

      - name: Import the signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: gpg --batch --import <<< "$APT_GPG_PRIVATE_KEY"

      - name: Build the repository
        run: |
          command -v apt-ftparchive > /dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils; }
          aws s3 sync "s3://$BUCKET/pool" apt/pool
          .github/scripts/build_apt_repository.sh apt dist/talon_*_amd64.deb

      # The packages go first, so the index never names a file that is not there.
      - name: Publish the repository
        env:
          DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
        run: |
          aws s3 sync apt/pool "s3://$BUCKET/pool"
          aws s3 cp apt/dists "s3://$BUCKET/dists" --recursive --cache-control no-cache
          aws s3 cp apt/talon.gpg "s3://$BUCKET/talon.gpg" --cache-control no-cache
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/dists/*' /talon.gpg
