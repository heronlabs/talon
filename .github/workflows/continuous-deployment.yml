name: 'Continuous Deployment'

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      semantic:
        description: The SEMVER specification.
        required: true
        type: choice
        default: patch
        options:
          - 'major'
          - 'minor'
          - 'patch'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: release
        uses: heronlabs/action-tag-release@v7
        with:
          ghToken: ${{ github.token }}
          semantic: ${{ inputs.semantic }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build the Linux binary and its .deb
        env:
          GOARCH: amd64
          VERSION: ${{ steps.release.outputs.version }}
        run: make package

      - name: Attach the binary and the .deb to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$TAG" dist/talon-linux-amd64 dist/talon_*_amd64.deb

  publish:
    name: 'Publish | apt'
    needs: release
    runs-on: ubuntu-24.04
    environment: 'main'
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: heronlabs/action-apt-repository@v1
        with:
          AWS_ROLE_TO_ASSUME: ${{ vars.APT_AWS_ROLE_TO_ASSUME }}
          AWS_REGION: ${{ vars.APT_AWS_REGION }}
          AWS_ENV_PATH: /talon/
          BUCKET_NAME: ${{ vars.APT_BUCKET_NAME }}
          DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          PACKAGE: talon
          TAG: ${{ needs.release.outputs.tag }}
          ORIGIN: Heron Labs
