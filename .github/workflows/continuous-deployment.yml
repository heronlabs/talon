name: 'Continuous Deployment'

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      semantic:
        description: The SEMVER specification.
        required: true
        type: choice
        default: patch
        options:
          - 'major'
          - 'minor'
          - 'patch'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: release
        uses: heronlabs/action-tag-release-build@v7
        with:
          ghToken: ${{ github.token }}
          semantic: ${{ inputs.semantic }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build the Linux binary and its .deb
        env:
          GOARCH: amd64
          VERSION: ${{ steps.release.outputs.version }}
        run: make package

      - name: Attach the binary and the .deb to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$TAG" dist/talon-linux-amd64 dist/talon_*_amd64.deb
