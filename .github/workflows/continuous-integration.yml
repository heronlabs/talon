name: 'Continuous Integration'

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Build'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: make build

  lint:
    needs: build
    name: 'Lint'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true

      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "$PWD" >> "$GITHUB_PATH"

      - run: make lint

  audit:
    needs: build
    name: 'Audit & Supply Chain'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: make audit

  unit:
    needs: build
    name: 'Unit Tests'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: make test

      - if: always()
        name: Upload unit-test coverage
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: coverage.out
          retention-days: 14
          if-no-files-found: warn

  integration:
    needs: unit
    name: 'Integration Tests'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: make test-integration

  mutation:
    needs: unit
    name: 'Mutation Tests'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Mutation tests
        run: |
          set -o pipefail
          make test-mutation 2>&1 | tee /tmp/mutation.log

      - name: Mutation summary
        if: always()
        run: |
          {
            echo "### Mutation testing"
            echo '```'
            grep -E '^(Killed|Timed out|Test efficacy|Mutator coverage)' /tmp/mutation.log || echo "see uploaded mutation-reports artifact"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        name: Upload mutation reports
        uses: actions/upload-artifact@v7
        with:
          name: mutation-reports
          path: reports/
          retention-days: 14
          if-no-files-found: warn
