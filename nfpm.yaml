# The talon .deb, built by `make package`. ARCH and VERSION come from the Makefile.
name: talon
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Heron Labs <org@heronlabs.com.br>
description: The Heron Labs agent for Easypanel hosts.

contents:
  - src: dist/talon-linux-${ARCH}
    dst: /usr/bin/talon
    expand: true
    file_info:
      mode: 0755
  - src: packaging/talon-upgrade.service
    dst: /usr/lib/systemd/system/talon-upgrade.service
    file_info:
      mode: 0644
  - src: packaging/talon-upgrade.timer
    dst: /usr/lib/systemd/system/talon-upgrade.timer
    file_info:
      mode: 0644
  - dst: /etc/talon
    type: dir
    file_info:
      mode: 0755

scripts:
  postinstall: packaging/postinstall
  preremove: packaging/preremove
  postremove: packaging/postremove
