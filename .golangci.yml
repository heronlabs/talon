version: "2"

run:
  build-tags: [integration]

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unparam
  settings:
    depguard:
      rules:
        core:
          files: ["**/src/core/**", "!$test"]
          deny:
            - pkg: github.com/heronlabs/talon/src/application
              desc: core imports nothing from application
            - pkg: github.com/heronlabs/talon/src/infrastructure
              desc: core imports nothing from infrastructure
        infrastructure:
          files: ["**/src/infrastructure/**", "!$test"]
          deny:
            - pkg: github.com/heronlabs/talon/src/application
              desc: infrastructure never imports application
  exclusions:
    presets: [comments, std-error-handling]

formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/heronlabs/talon]
