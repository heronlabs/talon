version: "2"

run:
  build-tags: [integration]

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unparam
  settings:
    depguard:
      rules:
        core:
          files: ["**/src/core/**", "!$test"]
          deny:
            - pkg: github.com/heronlabs/talon/src/application
              desc: core imports nothing from application
        entity:
          list-mode: strict
          files: ["**/src/core/entity/**", "!$test"]
          allow:
            - $gostd
            - github.com/heronlabs/talon/src/infrastructure/docker
            - github.com/heronlabs/talon/src/infrastructure/easypanel
            - github.com/heronlabs/talon/src/infrastructure/host
        infrastructure:
          files: ["**/src/infrastructure/**", "!$test"]
          deny:
            - pkg: github.com/heronlabs/talon/src/application
              desc: infrastructure never imports application
  exclusions:
    presets: [std-error-handling]

formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/heronlabs/talon]
